version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 99
    groups:
      eslint-bundle:
        patterns: [""*eslint*"]
        update-types: ["patch", "minor", "major"]
      minor-dependency-updates:
        patterns: ["*"]
        update-types: ["patch", "minor"]


